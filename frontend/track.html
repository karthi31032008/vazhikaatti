
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Complaint | VazhiKaatti</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f8f5;
            color: #263b3b;
        }

        header {
            background: white;
            padding: 18px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 10px #00000010;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #075e54;
            font-size: 22px;
            font-weight: bold;
        }

        .brand img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        nav a {
            text-decoration: none;
            color: #263b3b;
            margin-left: 20px;
            font-weight: 600;
        }

        nav a:hover {
            color: #168b55;
        }

        .container {
            max-width: 650px;
            margin: 75px auto;
            padding: 20px;
        }

        .track-card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 30px #0000000c;
            text-align: center;
        }

        .track-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        h1 {
            color: #075e54;
            margin-bottom: 12px;
        }

        .description {
            color: #687b78;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #cbded6;
            border-radius: 9px;
            font-size: 16px;
            margin-bottom: 18px;
            outline: none;
        }

        input:focus {
            border-color: #168b55;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #075e54;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #168b55;
        }

        #result {
            margin-top: 22px;
            padding: 16px;
            border-radius: 10px;
            background: #e8f7ed;
            color: #075e54;
            display: none;
            line-height: 1.6;
        }

        footer {
            background: #123c38;
            color: white;
            text-align: center;
            padding: 22px;
            margin-top: 80px;
        }

        @media(max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 7px;
                display: inline-block;
            }

            .track-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="brand">
        <img src="1000075942.jpg" alt="VazhiKaatti Logo">
        VazhiKaatti
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="local-services.html">Services</a>
        <a href="community.html">Community</a>
        <a href="complaints.html">Complaints</a>
    </nav>
</header>

<main class="container">
    <div class="track-card">

        <div class="track-icon">📋</div>

        <h1>Track Your Complaint</h1>

        <p class="description">
            Stay updated on your reported public issue.
            Enter your Complaint ID to check its current status.
        </p>

        <input
            type="text"
            id="complaintId"
            placeholder="Enter your Complaint ID"
        >

        <button onclick="trackComplaint()">
            Track Status
        </button>

        <div id="result"></div>

    </div>
</main>

<footer>
    <p>© 2026 VazhiKaatti | Guiding Cities, Empowering Citizens.</p>
</footer>

<script>
    function trackComplaint() {
        const id = document.getElementById("complaintId").value.trim();
        const result = document.getElementById("result");

        if (id === "") {
            result.style.display = "block";
            result.innerHTML = "Please enter your Complaint ID.";
            return;
        }

        result.style.display = "block";
        result.innerHTML =
            "Demo tracking page.<br>" +
            "Complaint ID: " + id + "<br>" +
            "Database tracking connection will be added next.";
    }
</script>

</body>
</html>
